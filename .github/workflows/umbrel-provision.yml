name: Provision Umbrel paper scout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt:
    if: github.actor == 'neurochilds' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cryptography==46.0.5
      - name: Encrypt existing digest credentials for Umbrel
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python deploy/encrypt_credentials.py
      - uses: actions/upload-artifact@v4
        with:
          name: umbrel-encrypted-credentials
          path: umbrel-credentials.enc.json
          retention-days: 1
          if-no-files-found: error
