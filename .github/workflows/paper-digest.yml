name: Neuro Paper Digest

on:
  # Production runs on Umbrel: Mon/Thu 09:45 UTC. Hosted runs are preview-only.
  workflow_dispatch:
    inputs:
      days:
        description: "Days back to check (1-90). Leave blank for default."
        required: false
        default: ""
      include_seen:
        description: "Include previously seen papers (true/false)"
        required: false
        default: "false"
      historical:
        description: "Use OpenAlex search (true/false). Default: true."
        required: false
        default: "true"
      start_date:
        description: "Start date YYYY-MM-DD (overrides days)"
        required: false
        default: ""
      end_date:
        description: "End date YYYY-MM-DD"
        required: false
        default: ""
      max_llm_candidates:
        description: "Max papers to send for AI scoring (default 200)"
        required: false
        default: ""
      dry_run:
        description: "Preview only; production delivery runs on Umbrel"
        required: false
        default: "true"
      fetch_only:
        description: "Retrieval preview only: no AI calls, email or state changes (true/false)"
        required: false
        default: "false"

concurrency:
  group: paper-digest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require a preview on GitHub
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FETCH_ONLY: ${{ inputs.fetch_only }}
        run: |
          if [ "$INPUT_DRY_RUN" != "true" ] && [ "$INPUT_FETCH_ONLY" != "true" ]; then
            echo "Production delivery runs on Umbrel; select dry_run or fetch_only."
            exit 1
          fi
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          PYTHONUNBUFFERED: "1"
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_INCLUDE_SEEN: ${{ inputs.include_seen }}
          INPUT_HISTORICAL: ${{ inputs.historical }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
          INPUT_MAX_LLM: ${{ inputs.max_llm_candidates }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FETCH_ONLY: ${{ inputs.fetch_only }}
        run: |
          args=()
          if [ -n "$INPUT_DAYS" ]; then args+=("--days" "$INPUT_DAYS"); fi
          if [ "$INPUT_INCLUDE_SEEN" = "true" ]; then args+=("--include-seen"); fi
          if [ "$INPUT_HISTORICAL" = "true" ]; then args+=("--historical"); fi
          if [ "$INPUT_HISTORICAL" = "false" ]; then args+=("--rss"); fi
          if [ -n "$INPUT_START_DATE" ]; then args+=("--start-date" "$INPUT_START_DATE"); fi
          if [ -n "$INPUT_END_DATE" ]; then args+=("--end-date" "$INPUT_END_DATE"); fi
          if [ -n "$INPUT_MAX_LLM" ]; then args+=("--max-llm-candidates" "$INPUT_MAX_LLM"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=("--dry-run"); fi
          if [ "$INPUT_FETCH_ONLY" = "true" ]; then args+=("--fetch-only"); fi
          if [ "$INPUT_DRY_RUN" = "true" ] || [ "$INPUT_FETCH_ONLY" = "true" ]; then
            args+=("--preview-file" "preview.html")
          fi
          python paper_tracker.py "${args[@]}"

      - name: Save preview
        if: inputs.dry_run == 'true' || inputs.fetch_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paper-scout-preview
          path: preview.html
          if-no-files-found: ignore
